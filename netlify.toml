[build]
  command = "npm --prefix client install && npm --prefix client run build && npm --prefix server install"
  publish = "client/dist"
  functions = "server"

# Route API requests to the Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Route all other frontend requests to React's index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
