[build]
  command = "cd client && npm install && npm run build && cd ../server && npm install && cd .."
  publish = "client/dist"
  functions = "netlify/functions"

# Route API requests to the Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Route all other frontend requests to React's index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
